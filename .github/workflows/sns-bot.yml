name: SNS Bot Preview (disabled for jellyfish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Dry-run only
        run: npm run bot:post -- --dry-run
        env:
          BOT_ENABLED: "true"
          SITE_URL: ${{ vars.SITE_URL }}
          BOT_PLATFORMS: "threads"
          BOT_POSTS_PER_DAY: "1"
          BOT_SLOT: "0"
          # Live book posting to jellyfish.1619959 is intentionally disabled.
          # This workflow must remain preview-only until a different target account is configured.
          THREADS_GIST_ACCOUNT: "jellyfish.1619959"
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
